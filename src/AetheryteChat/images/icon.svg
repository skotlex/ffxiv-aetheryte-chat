<!-- Aetheryte Chat 아이콘 원본. 게임 리소스 없이 직접 그렸다. 글자는 Windows 폰트(Yu Gothic, Malgun Gothic)로 그려지므로
     PNG 는 Windows 에서 브라우저로 512x512 로 뽑는다 (예: msedge --headless --screenshot --window-size=512,512) -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2550"/>
      <stop offset="1" stop-color="#0f6f80"/>
    </linearGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9fbff"/>
      <stop offset="0.55" stop-color="#7fd8ff"/>
      <stop offset="1" stop-color="#3a8fe0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9fe6ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9fe6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#06142b" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>

  <!-- 뒤 말풍선: 일본어 -->
  <g filter="url(#shadow)">
    <path d="M232 92 h176 a44 44 0 0 1 44 44 v104 a44 44 0 0 1 -44 44 h-30 l12 44 l-58 -44 h-100 a44 44 0 0 1 -44 -44 v-104 a44 44 0 0 1 44 -44 z"
          fill="#8fdcff"/>
    <text x="320" y="230" text-anchor="middle" font-family="Yu Gothic UI, Yu Gothic, Meiryo, sans-serif"
          font-weight="700" font-size="132" fill="#13224a">あ</text>
  </g>

  <!-- 앞 말풍선: 한국어 -->
  <g filter="url(#shadow)">
    <path d="M104 228 h176 a44 44 0 0 1 44 44 v104 a44 44 0 0 1 -44 44 h-100 l-58 44 l12 -44 h-30 a44 44 0 0 1 -44 -44 v-104 a44 44 0 0 1 44 -44 z"
          fill="#ffffff"/>
    <text x="192" y="366" text-anchor="middle" font-family="Malgun Gothic, sans-serif"
          font-weight="700" font-size="128" fill="#13224a">가</text>
  </g>

  <!-- 크리스털 -->
  <circle cx="116" cy="128" r="74" fill="url(#glow)"/>
  <g transform="translate(116 128)">
    <path d="M0 -62 L30 0 L0 62 L-30 0 Z" fill="url(#crystal)" stroke="#ffffff" stroke-opacity="0.85" stroke-width="4" stroke-linejoin="round"/>
    <path d="M0 -62 L0 62 M-30 0 L30 0" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3"/>
  </g>
</svg>
